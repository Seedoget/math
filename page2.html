<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长方体的展开图 · 观察与操作</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/style.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<style>
  :root{
    --bg:#14171e; --panel:#1b1f28; --line:#2b3140; --ink:#e8e4da; --ink-dim:#9aa0ad;
    --accent:#e8863a; --accent-soft:rgba(232,134,58,.14); --cut:#cf5b40; --ok:#7fd1c8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'LXGW WenKai Screen','Noto Serif SC',serif; color:var(--ink); background:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:46px 46px;
  }
  /* ── 顶栏 ── */
  header{
    position:fixed; inset:0 0 auto 0; height:64px; z-index:20; display:flex; align-items:center;
    padding:0 22px; gap:14px; border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(20,23,30,.96),rgba(20,23,30,.82)); backdrop-filter:blur(6px);
  }
  .mark{width:30px;height:30px;flex:none}
  header h1{font-size:20px;font-weight:700;letter-spacing:.06em}
  header .sub{font-size:12.5px;color:var(--ink-dim);letter-spacing:.14em;margin-top:2px}
  #stageBadge{
    margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim);
    border:1px solid var(--line); border-radius:99px; padding:6px 14px; background:rgba(255,255,255,.02);
  }
  #stageBadge i{width:8px;height:8px;border-radius:50%;background:var(--ok);transition:background .3s}
  /* ── 左侧面板 ── */
  #panel{
    position:fixed; z-index:20; left:18px; top:84px; bottom:18px; width:272px;
    background:rgba(27,31,40,.93); border:1px solid var(--line); border-radius:16px;
    padding:18px 16px; display:flex; flex-direction:column; gap:14px; backdrop-filter:blur(8px);
    overflow-y:auto;
  }
  .ptitle{font-size:12px;letter-spacing:.28em;color:var(--ink-dim);margin:2px 0 -4px 4px}
  .card{
    display:flex; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--line);
    border-radius:12px; cursor:pointer; transition:all .18s; background:rgba(255,255,255,.015);
  }
  .card:hover{border-color:#3b4356}
  .card.on{border-color:var(--accent); background:var(--accent-soft)}
  .card svg{flex:none}
  .card .nm{font-size:15px;line-height:1.25}
  .card .ds{font-size:11.5px;color:var(--ink-dim);margin-top:2px}
  .divider{height:1px;background:var(--line);margin:2px 2px}
  /* 剪裁进度 */
  #progress{padding:2px 4px}
  #progress .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  #progress b{font-size:14px}
  #progress .cnt{font-size:13px;color:var(--ink-dim)}
  #progress .cnt em{font-style:normal;color:var(--cut);font-weight:700}
  #dots{display:flex;flex-wrap:wrap;gap:5px}
  #dots span{width:15px;height:5px;border-radius:3px;background:#39404f;transition:all .3s}
  #dots span.cut{background:var(--cut);box-shadow:0 0 6px rgba(207,91,64,.55)}
  /* 步骤 */
  #steps{list-style:none;padding:2px 4px;display:flex;flex-direction:column;gap:8px}
  #steps li{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink-dim);transition:color .3s}
  #steps li i{font-style:normal;width:19px;height:19px;flex:none;border:1px solid var(--line);border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;transform:translateY(3px)}
  #steps li.act{color:var(--ink)}
  #steps li.act i{border-color:var(--accent);color:var(--accent)}
  #steps li.done{color:#6f7683}
  #steps li.done i{background:var(--accent);border-color:var(--accent);color:#1b1f28}
  /* 按钮 */
  #btnMain{
    border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:16px;font-weight:700;
    letter-spacing:.2em;cursor:pointer;color:#1b130a;background:var(--accent);transition:filter .15s, transform .05s;
  }
  #btnMain:hover{filter:brightness(1.08)}
  #btnMain:active{transform:scale(.98)}
  #btnReset{
    border:1px solid var(--line);border-radius:12px;padding:10px;font-family:inherit;font-size:13.5px;
    letter-spacing:.2em;cursor:pointer;color:var(--ink-dim);background:transparent;transition:all .15s;
  }
  #btnReset:hover{color:var(--ink);border-color:#3b4356}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  /* ── 3D 舞台 ── */
  #stage{position:fixed;inset:0;cursor:grab;touch-action:none}
  #stage.dragging{cursor:grabbing}
  /* 底部提示条 */
  #hint{
    position:fixed;z-index:20;bottom:22px;left:50%;transform:translateX(-50%);
    background:rgba(27,31,40,.9);border:1px solid var(--line);border-radius:99px;
    padding:9px 22px;font-size:13.5px;color:var(--ink-dim);white-space:nowrap;backdrop-filter:blur(6px);
    transition:color .3s; pointer-events:none;
  }
  #hint b{color:var(--ink);font-weight:400}
  /* toast */
  #toast{
    position:fixed;z-index:30;top:80px;left:50%;transform:translate(-50%,-12px);opacity:0;
    background:#232835;border-radius:12px;padding:11px 20px;font-size:14px;max-width:76vw;
    border:1px solid var(--line);border-left:3px solid var(--ok);pointer-events:none;
    transition:all .3s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 8px 28px rgba(0,0,0,.4);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast.warn{border-left-color:var(--cut)}
  /* modal 弹框 */
  #modal{
    position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    background:rgba(10,12,16,.55);backdrop-filter:blur(3px);
  }
  #modal.show{display:flex}
  #modal .box{
    background:#232835;border:1px solid var(--line);border-left:3px solid var(--cut);
    border-radius:14px;padding:24px 30px 20px;text-align:center;max-width:320px;margin:0 30px;
    box-shadow:0 18px 50px rgba(0,0,0,.5);animation:popIn .22s cubic-bezier(.2,.9,.3,1.3);
  }
  #modal .box p{font-size:17.5px;line-height:1.65}
  #modal button{
    margin-top:18px;border:none;border-radius:10px;padding:9px 30px;font-family:inherit;
    font-size:15px;font-weight:700;letter-spacing:.12em;cursor:pointer;color:#1b130a;background:var(--accent);
  }
  #modal button:hover{filter:brightness(1.08)}
  @keyframes popIn{from{transform:scale(.86);opacity:0}}
  /* 展开图收集 */
  #collectWrap{padding:0 2px}
  #collectRow{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 6px;scrollbar-width:thin}
  .colItem{
    flex:none;width:96px;border:1px solid var(--line);border-radius:10px;padding:6px 6px 4px;
    background:rgba(255,255,255,.015);
  }
  .colItem svg{display:block;width:100%;height:auto}
  .colItem .no{font-size:11px;color:var(--ink-dim);text-align:center;margin-top:3px}
</style>
</head>
<body>

<header>
  <svg class="mark" viewBox="0 0 30 30" fill="none">
    <rect x="4" y="9" width="16" height="12" rx="1" stroke="#e8863a" stroke-width="1.6"/>
    <path d="M4 9 L10 4 H26 L20 9 M20 9 H26 V16 L20 21" stroke="#e8863a" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M22 24 L27 29 M27 24 L22 29" stroke="#7fd1c8" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>长方体的展开图</h1>
    <div class="sub">观察 · 剪一剪 · 折一折</div>
  </div>
  <div id="stageBadge"><i></i><span id="stageText">观察剪裁</span></div>
</header>

<aside id="panel">
  <div class="ptitle">选择组件</div>
  <div id="cards" style="display:flex;flex-direction:column;gap:9px"></div>
  <div class="divider"></div>
  <div id="progress">
    <div class="row"><b>剪裁进度</b><span class="cnt" id="cutCnt"></span></div>
    <div id="dots"></div>
  </div>
  <div class="divider"></div>
  <div class="ptitle">操作步骤</div>
  <ol id="steps">
    <li><i>1</i>拖拽旋转，从不同角度观察模型</li>
    <li><i>2</i>点击棱，用剪刀逐条剪开</li>
    <li><i>3</i>展开成平面展开图，再折回复原</li>
  </ol>
  <div id="collectWrap" style="display:none">
    <div class="divider"></div>
    <div class="ptitle">收集的展开图 <span id="collectCnt" style="color:var(--accent)"></span></div>
    <div id="collectRow"></div>
  </div>
  <div style="flex:1"></div>
  <button id="btnMain">展 开</button>
  <button id="btnReset">重 置</button>
</aside>

<div id="stage"></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="modal"><div class="box"><p id="modalMsg"></p><button id="modalBtn">知道啦</button></div></div>

<script>
/* ================= 基础工具 ================= */
const V3=(x=0,y=0,z=0)=>new THREE.Vector3(x,y,z);
const M4=()=>new THREE.Matrix4();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOutCubic=t=>1-Math.pow(1-t,3);
const easeOutBack=t=>{const c=1.0;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const qz=a=>new THREE.Quaternion().setFromAxisAngle(V3(0,0,1),a);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* 补间动画管理器 */
const tweens=[];
function tween(dur,update,ease=t=>t,delay=0){
  return new Promise(res=>tweens.push({t0:performance.now()+delay,dur,update,ease,res}));
}
function stepTweens(now){
  for(let i=tweens.length-1;i>=0;i--){
    const tw=tweens[i];
    if(now<tw.t0)continue;
    const k=clamp((now-tw.t0)/tw.dur,0,1);
    tw.update(tw.ease(k));
    if(k>=1){tweens.splice(i,1);tw.res();}
  }
}

/* ================= 组件定义 ================= */
const CONFIGS=[
  {id:'tube', name:'上下无盖长方体', sub:'像一段通风管 · 4 个面',
   W:3.4,D:1.4,H:1.4, faces:['front','back','left','right'], root:'front', icon:'tube'},
  {id:'openbox', name:'无盖有底长方体', sub:'像一只开口纸盒 · 5 个面',
   W:2.6,D:1.8,H:1.4, faces:['bottom','front','back','left','right'], root:'bottom', icon:'openbox'},
  {id:'closedbox', name:'有两个盖的长方体', sub:'上下都有盖 · 完整 6 个面',
   W:2.6,D:1.6,H:1.1, faces:['bottom','top','front','back','left','right'], root:'bottom', icon:'closedbox'},
];

/* 每个面的闭合姿态：中心 + 局部基（局部 z = 外法线） */
function faceDefs(W,D,H){
  return {
    bottom:{center:V3(0,-H/2,0), ax:V3(1,0,0), ay:V3(0,0,1),  size:[W,D], label:'下\n面'},
    top:   {center:V3(0, H/2,0), ax:V3(1,0,0), ay:V3(0,0,-1), size:[W,D], label:'上\n面'},
    front: {center:V3(0,0, D/2), ax:V3(1,0,0), ay:V3(0,1,0),  size:[W,H], label:'前\n面'},
    back:  {center:V3(0,0,-D/2), ax:V3(-1,0,0),ay:V3(0,1,0),  size:[W,H], label:'后\n面'},
    right: {center:V3( W/2,0,0), ax:V3(0,0,-1),ay:V3(0,1,0),  size:[D,H], label:'右\n面'},
    left:  {center:V3(-W/2,0,0), ax:V3(0,0,1), ay:V3(0,1,0),  size:[D,H], label:'左\n面'},
  };
}
/* 12 条棱全集（按组件拥有的面过滤） */
function edgeDefs(W,D,H){
  const E=[
    ['bottom','front','x',V3(0,-H/2, D/2)], ['bottom','back','x',V3(0,-H/2,-D/2)],
    ['bottom','left','z',V3(-W/2,-H/2,0)],  ['bottom','right','z',V3( W/2,-H/2,0)],
    ['top','front','x',V3(0, H/2, D/2)],    ['top','back','x',V3(0, H/2,-D/2)],
    ['top','left','z',V3(-W/2, H/2,0)],     ['top','right','z',V3( W/2, H/2,0)],
    ['front','left','y',V3(-W/2,0, D/2)],   ['front','right','y',V3( W/2,0, D/2)],
    ['back','left','y',V3(-W/2,0,-D/2)],    ['back','right','y',V3( W/2,0,-D/2)],
  ];
  return E.map(([a,b,axis,mid])=>({f1:a,f2:b,axis,mid,len:axis==='x'?W:axis==='z'?D:H}));
}
function worldMatOf(def){
  const az=V3().crossVectors(def.ax,def.ay);
  return M4().makeBasis(def.ax.clone(),def.ay.clone(),az).setPosition(def.center.clone());
}
function axisVec(axis){return axis==='x'?V3(1,0,0):axis==='y'?V3(0,1,0):V3(0,0,1);}

/* ================= 场景 ================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(38,1,0.1,100);
camera.position.set(0,0.7,10); camera.lookAt(0,-0.1,0);
scene.add(new THREE.AmbientLight(0xffffff,.78));
const dl=new THREE.DirectionalLight(0xffffff,.55); dl.position.set(3,5,4); scene.add(dl);
const dl2=new THREE.DirectionalLight(0xfff2df,.22); dl2.position.set(-3,-2,-4); scene.add(dl2);

const spinGroup=new THREE.Group(); scene.add(spinGroup);   // 用户旋转
const fitGroup=new THREE.Group();  spinGroup.add(fitGroup); // 展开/收拢的缩放补偿
spinGroup.quaternion.copy(new THREE.Quaternion().setFromEuler(new THREE.Euler(-0.44,0.62,0,'XYZ')));

function resize(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',resize); resize();

/* 面标签纹理（数学方格纸风） */
const labelFaces=[]; // 字体就绪后重绘
function drawFaceCanvas(label,w,h){
  const px=360, cw=Math.max(Math.round(px*w/h),64), ch=px;
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const g=c.getContext('2d');
  g.fillStyle='#e9dec4'; g.fillRect(0,0,cw,ch);
  g.strokeStyle='#d9cba7'; g.lineWidth=6; g.strokeRect(3,3,cw-6,ch-6);
  g.strokeStyle='rgba(190,170,130,.35)'; g.lineWidth=2;
  for(let x=40;x<cw;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,ch);g.stroke();}
  for(let y=40;y<ch;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(cw,y);g.stroke();}
  const lines=label.split('\n');
  g.fillStyle='#b39a6b'; g.textAlign='center'; g.textBaseline='middle';
  g.font=`600 ${Math.round(px*.24)}px "LXGW WenKai Screen", serif`;
  lines.forEach((ln,i)=>g.fillText(ln, cw/2, ch/2+(i-(lines.length-1)/2)*px*.3));
  return c;
}
function makeFaceMaterial(def){
  const tex=new THREE.CanvasTexture(drawFaceCanvas(def.label,def.size[0],def.size[1]));
  tex.anisotropy=4;
  labelFaces.push({tex,label:def.label,w:def.size[0],h:def.size[1]});
  return new THREE.MeshLambertMaterial({map:tex,side:THREE.DoubleSide});
}
if(document.fonts)document.fonts.ready.then(()=>{
  labelFaces.forEach(f=>{f.tex.image=drawFaceCanvas(f.label,f.w,f.h); f.tex.needsUpdate=true;});
});

/* ================= 模型状态 ================= */
const COL={edge:0x4a5260,cut:0xcf5b40,hover:0xffd166,bridge:0x9e4a3a,alarm:0xe05545};
const EDGE_T=0.06;
let model=null, state='idle', hinges=[], fitFrom=null, fitTo=null;
let session=0;   // 会话令牌：重置后使进行中的异步流程作废

function disposeObject(o){
  o.traverse(n=>{
    if(n.geometry)n.geometry.dispose();
    if(n.material){ if(n.material.map)n.material.map.dispose(); n.material.dispose(); }
  });
}
function clearModel(){
  if(!model)return;
  [...fitGroup.children].forEach(c=>{fitGroup.remove(c);disposeObject(c);});
  hinges=[]; model=null;
}

function buildModel(cfg){
  session++;
  clearModel();
  const defs=faceDefs(cfg.W,cfg.D,cfg.H);
  const faces={};
  cfg.faces.forEach(name=>{
    const d=defs[name];
    const g=new THREE.Group();
    g.position.copy(d.center);
    g.quaternion.setFromRotationMatrix(M4().makeBasis(d.ax.clone(),d.ay.clone(),V3().crossVectors(d.ax,d.ay)));
    const mesh=new THREE.Mesh(new THREE.PlaneGeometry(d.size[0],d.size[1]),makeFaceMaterial(d));
    g.add(mesh); fitGroup.add(g);
    faces[name]={name,def:d,group:g,mesh};
  });
  const allEdges=edgeDefs(cfg.W,cfg.D,cfg.H)
    .filter(e=>cfg.faces.includes(e.f1)&&cfg.faces.includes(e.f2));
  const edges=allEdges.map((e,i)=>{
    const n1=V3().crossVectors(defs[e.f1].ax,defs[e.f1].ay);
    const n2=V3().crossVectors(defs[e.f2].ax,defs[e.f2].ay);
    const mat=new THREE.MeshLambertMaterial({color:COL.edge});
    const m=new THREE.Mesh(new THREE.BoxGeometry(e.len+0.03,EDGE_T,EDGE_T),mat); // 稍长，棱角处也好点中
    if(e.axis==='y')m.rotation.z=Math.PI/2;
    if(e.axis==='z')m.rotation.y=Math.PI/2;
    m.position.copy(e.mid).add(V3().addVectors(n1,n2).normalize().multiplyScalar(0.005));
    fitGroup.add(m);
    return {id:i,f1:e.f1,f2:e.f2,axis:e.axis,mid:e.mid,len:e.len,n1,n2,
            full:m,state:'ok',
            home:{pos:m.position.clone(),quat:m.quaternion.clone()},edgeParent:null};
  });
  model={cfg,faces,edges,cutCount:0,needCut:allEdges.length-(cfg.faces.length-1)};
  renderDots(); updateProgress(); setStage('观察剪裁','var(--ok)');
  setHint('拖拽<b>旋转</b>模型，把鼠标移到<b>棱</b>上，点击剪开');
  updateSteps();
  renderCollect();
}

/* ================= 连通性 / 桥检测 ================= */
function connectedWith(edgesLeft){
  const f=model.cfg.faces, parent={};
  f.forEach(x=>parent[x]=x);
  const find=x=>parent[x]===x?x:(parent[x]=find(parent[x]));
  edgesLeft.forEach(e=>{const a=find(e.f1),b=find(e.f2); if(a!==b)parent[a]=b;});
  const r=find(f[0]); return f.every(x=>find(x)===r);
}
function remainingEdges(except){ return model.edges.filter(e=>e.state==='ok'&&e!==except); }
function isBridge(e){ return !connectedWith(remainingEdges(e)); }

/* ================= 剪开 ================= */
async function cutEdge(e,s){
  e.state='cut';
  setHovered(null);
  /* 剪开瞬间：红光一闪，随即整条隐藏 */
  const base=new THREE.Color(COL.edge),red=new THREE.Color(COL.cut);
  await tween(260,k=>{
    if(s!==session)return;
    const pulse=Math.pow(Math.abs(Math.sin(2*Math.PI*k)),1.2);
    e.full.material.color.copy(base).lerp(red,pulse);
  });
  if(s!==session)return;
  e.full.visible=false;
  e.full.material.color.copy(base);
  model.cutCount++;
  renderDots(); updateProgress();
  if(model.cutCount>=model.needCut){
    toast('剪够了！点击「展 开」按钮，看看展开图的样子','ok');
    setHint('剪够了！点击左下角<b>「展 开」</b>按钮');
  }else{
    setHint(`已剪开 <b>${model.cutCount}</b> 刀`);
  }
}
async function alarmEdge(e){
  const base=new THREE.Color(COL.edge),red=new THREE.Color(COL.alarm);
  await tween(680,k=>{
    e.full.material.color.copy(base).lerp(red,Math.pow(Math.abs(Math.sin(3*Math.PI*k)),1.5));
  });
  if(model&&model.edges.includes(e))e.full.material.color.copy(base);
}

/* ================= 展开层级重建（核心算法） ================= */
function buildTree(){
  const rem=remainingEdges(null), children={},depth={};
  model.cfg.faces.forEach(f=>children[f]=[]);
  const root=model.cfg.root; depth[root]=0;
  const q=[root]; const used=new Set();
  while(q.length){
    const p=q.shift();
    rem.forEach((e,idx)=>{
      if(used.has(idx))return;
      let c=null; if(e.f1===p)c=e.f2; else if(e.f2===p)c=e.f1;
      if(c&&depth[c]===undefined){used.add(idx);children[p].push({child:c,edge:e});depth[c]=depth[p]+1;q.push(c);}
    });
  }
  return {children,depth,maxDepth:Math.max(...Object.values(depth))};
}
function buildHierarchy(){
  const {children,depth,maxDepth}=buildTree();
  hinges=[];
  const rootName=model.cfg.root, rootFace=model.faces[rootName];
  fitGroup.add(rootFace.group);
  rootFace.group.position.copy(rootFace.def.center);
  rootFace.group.quaternion.setFromRotationMatrix(M4().makeBasis(
    rootFace.def.ax.clone(),rootFace.def.ay.clone(),V3().crossVectors(rootFace.def.ax,rootFace.def.ay)));

  function attach(parentName,parentGroup,parentWorld){
    children[parentName].forEach(({child,edge})=>{
      const sFace=model.faces[child];
      const Tp=parentWorld, Ts=worldMatOf(sFace.def);
      const pDef=model.faces[parentName].def;
      const n_p=V3().crossVectors(pDef.ax,pDef.ay).normalize();
      const A=axisVec(edge.axis);
      /* 铰链坐标系（世界，位于棱中点，z 轴 = 棱方向） */
      const Hz=A.clone();
      const Hy=V3().crossVectors(n_p,Hz).normalize();
      const Hx=V3().crossVectors(Hy,Hz).normalize();
      const MH=M4().makeBasis(Hx,Hy,Hz).setPosition(edge.mid.clone());
      /* 子面展开姿态：法线贴平父面、共享棱方向不变 */
      const Alocal=new THREE.Vector3(A.dot(sFace.def.ax),A.dot(sFace.def.ay),0);
      let colX,colY;
      if(Math.abs(Alocal.x)>0.9){
        colX=A.clone().multiplyScalar(Math.sign(Alocal.x));
        colY=V3().crossVectors(n_p,colX).normalize();
      }else{
        colY=A.clone().multiplyScalar(Math.sign(Alocal.y));
        colX=V3().crossVectors(colY,n_p).normalize();
      }
      const Rc=M4().makeBasis(sFace.def.ax.clone(),sFace.def.ay.clone(),
        V3().crossVectors(sFace.def.ax,sFace.def.ay));
      const vLocal=V3().subVectors(sFace.def.center,edge.mid).applyMatrix4(M4().copy(Rc).transpose());
      const Copen=edge.mid.clone().add(vLocal.applyMatrix4(M4().makeBasis(colX,colY,n_p.clone())));
      const TsOpen=M4().makeBasis(colX,colY,n_p.clone()).setPosition(Copen);
      /* 子面 / 铰链的局部姿态（展开时） */
      const T_hs=M4().copy(MH).invert().multiply(TsOpen);
      const MH_local=M4().copy(Tp).invert().multiply(MH);
      const H=new THREE.Group();
      {const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();
       MH_local.decompose(p,q,s); H.position.copy(p); H.quaternion.copy(q);}
      const q0=H.quaternion.clone();
      /* 数值求解闭合角 θ ∈ {±90°} */
      const one=V3(1,1,1), zero=V3(0,0,0);
      let theta=Math.PI/2;
      for(const sg of [1,-1]){
        const test=M4().copy(MH).multiply(M4().compose(zero,qz(sg*Math.PI/2),one)).multiply(T_hs);
        const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();
        const pe=new THREE.Vector3(),qe=new THREE.Quaternion(),se=new THREE.Vector3();
        test.decompose(p,q,s); Ts.decompose(pe,qe,se);
        if(p.distanceTo(pe)<1e-3&&Math.abs(q.dot(qe))>0.999){theta=sg*Math.PI/2;break;}
      }
      /* 子面挂到铰链下，铰链挂到父面下 */
      {const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();
       T_hs.decompose(p,q,s); sFace.group.position.copy(p); sFace.group.quaternion.copy(q);}
      H.add(sFace.group);
      parentGroup.add(H);
      H.quaternion.copy(q0).multiply(qz(theta));   // 初始为闭合姿态
      hinges.push({group:H,q0,theta,depth:depth[child],t0:0,t1:1});
      attach(child,sFace.group,Ts);
    });
  }
  attach(rootName,rootFace.group,worldMatOf(rootFace.def));
  /* 逐层错开的动画窗口（依次展开的韵律） */
  const DL=0.11,SEG=0.62, span=maxDepth*DL+SEG;
  hinges.forEach(h=>{h.t0=h.depth*DL/span; h.t1=(h.depth*DL+SEG)/span;});
  return {children,depth,maxDepth};
}
/* 展开前：把未剪的棱挂到树中较浅的面上，跟随面翻转（棱即铰链轴，展开后才贴合接缝） */
function attachEdgesToFlat(tree){
  model.edges.forEach(e=>{
    if(e.state!=='ok')return;
    const parentName=tree.depth[e.f1]<=tree.depth[e.f2]?e.f1:e.f2;
    const g=model.faces[parentName].group;
    g.updateMatrixWorld(true);
    e.full.updateMatrixWorld(true);
    const local=M4().copy(g.matrixWorld).invert().multiply(e.full.matrixWorld);
    const p=new THREE.Vector3(),q=new THREE.Quaternion(),s=new THREE.Vector3();
    local.decompose(p,q,s);
    g.add(e.full);
    e.full.position.copy(p); e.full.quaternion.copy(q);
    e.edgeParent=parentName;
  });
}
/* 复原后：把棱挂回 fitGroup 原始位姿 */
function detachEdgesFromFaces(){
  model.edges.forEach(e=>{
    if(!e.edgeParent)return;
    fitGroup.add(e.full);
    e.full.position.copy(e.home.pos); e.full.quaternion.copy(e.home.quat);
    e.edgeParent=null;
  });
}
function computeFlatBounds(){
  const savedSpin=spinGroup.quaternion.clone();
  spinGroup.quaternion.identity();
  const savedH=hinges.map(h=>h.group.quaternion.clone());
  hinges.forEach(h=>h.group.quaternion.copy(h.q0));
  fitGroup.position.set(0,0,0); fitGroup.scale.setScalar(1);
  fitGroup.updateMatrixWorld(true);
  const box=new THREE.Box3();
  Object.values(model.faces).forEach(f=>{
    const [sx,sy]=f.def.size;
    [[-sx/2,-sy/2],[sx/2,-sy/2],[sx/2,sy/2],[-sx/2,sy/2]].forEach(([x,y])=>{
      box.expandByPoint(V3(x,y,0).applyMatrix4(f.mesh.matrixWorld));
    });
  });
  hinges.forEach((h,i)=>h.group.quaternion.copy(savedH[i]));
  spinGroup.quaternion.copy(savedSpin);
  return {center:box.getCenter(new THREE.Vector3()), radius:box.getSize(new THREE.Vector3()).length()/2};
}
function setUnfoldK(k){
  hinges.forEach(h=>{
    const lk=clamp((k-h.t0)/(h.t1-h.t0),0,1);
    h.group.quaternion.copy(h.q0).multiply(qz(h.theta*(1-easeOutBack(lk))));
  });
  const fe=easeInOutCubic(k);
  fitGroup.scale.setScalar(lerp(fitFrom.s,fitTo.s,fe));
  fitGroup.position.lerpVectors(fitFrom.p,fitTo.p,fe);
}
function fitTargets(bounds){
  const vh=2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const fs=Math.min(1,vh*0.62/bounds.radius);
  return {s:fs,p:bounds.center.clone().multiplyScalar(-fs)};
}

async function doUnfold(){
  const s=session;
  state='unfolding'; setStage('展开中…','var(--accent)'); updateSteps();
  setHint('正在展开，注意观察每个面是怎样翻转的…');
  const tree=buildHierarchy();
  attachEdgesToFlat(tree);
  const bounds=computeFlatBounds();
  fitFrom={s:1,p:V3()}; fitTo=fitTargets(bounds);
  await tween(1750,k=>setUnfoldK(k));
  if(s!==session)return;
  state='flat'; setStage('已展开','var(--accent)'); updateSteps();
  setHint('展开完成！数一数共有 <b>'+model.cfg.faces.length+'</b> 个长方形，点击<b>「复 原」</b>折回长方体');
  document.getElementById('btnMain').textContent='复 原';
  toast('展开成功！'+(recordCollect()||'这就是长方体的一种展开图'),'ok');
}
async function doFoldAndHeal(){
  const s=session;
  state='folding'; setStage('折回中…','var(--accent)'); updateSteps();
  setHint('正在折回成长方体…');
  /* 折回：外层先折 */
  const maxD=Math.max(...hinges.map(h=>h.depth));
  const saved=hinges.map(h=>h.t0);
  const DL=0.09,SEG=0.7,span=maxD*DL+SEG;
  hinges.forEach(h=>{const d=(maxD-h.depth)*DL; h.t0=d/span; h.t1=(d+SEG)/span;});
  await tween(1250,k=>setUnfoldK(1-k));
  hinges.forEach((h,i)=>{h.t0=saved[i];});
  if(s!==session)return;
  /* 层级还原为平级闭合 */
  Object.values(model.faces).forEach(f=>{
    if(f.group.parent)f.group.parent.remove(f.group);
    fitGroup.add(f.group);
    f.group.position.copy(f.def.center);
    f.group.quaternion.setFromRotationMatrix(M4().makeBasis(
      f.def.ax.clone(),f.def.ay.clone(),V3().crossVectors(f.def.ax,f.def.ay)));
  });
  hinges=[];
  fitGroup.scale.setScalar(1); fitGroup.position.set(0,0,0);
  detachEdgesFromFaces();
  /* 剪开的棱：随机次序，各自在原位闪烁 3 次后恢复常态 */
  state='healing'; setStage('棱愈合中…','var(--cut)');
  setHint('剪开的棱正在<b>闪烁愈合</b>，仔细看…');
  const cuts=model.edges.filter(e=>e.state==='cut');
  for(let i=cuts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cuts[i],cuts[j]]=[cuts[j],cuts[i]];}
  await Promise.all(cuts.map((e,i)=>healEdge(e,250+i*190+Math.random()*130,s)));
  if(s!==session)return;
  cuts.forEach(e=>{
    e.state='ok';   // 复原棱状态，否则无法剪第二种
    e.full.visible=true; e.full.material.color.setHex(COL.edge);
  });
  model.cutCount=0; renderDots(); updateProgress();
  state='idle'; setStage('观察剪裁','var(--ok)'); updateSteps();
  document.getElementById('btnMain').textContent='展 开';
  setHint('已复原！可以重新剪一剪，试试别的剪法，能得到<b>不同的展开图</b>');
  toast('复原完成，试着换一种剪法吧！','ok');
}
async function healEdge(e,delay,s){
  await sleep(delay);
  if(s!==session)return;
  /* 原位整条出现，闪烁 3 次，随后恢复常态 */
  e.full.visible=true;
  const cut=new THREE.Color(COL.cut),edge=new THREE.Color(COL.edge);
  e.full.material.color.copy(cut);
  await tween(900,k=>{
    if(s!==session)return;
    const pulse=Math.pow(Math.abs(Math.sin(3*Math.PI*k)),1.4);
    e.full.material.color.copy(cut).lerp(edge,pulse);
  });
  if(s!==session)return;
  e.full.material.color.copy(edge);
}

/* ================= 指针交互：旋转 / 悬停 / 剪切 ================= */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2(2,2);
let hovered=null, dragging=false, downPos=null, downT=0, vel={x:0,y:0}, moved=0;

const rot2=(dx,dy)=>{
  spinGroup.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(V3(1,0,0),dy))
    .premultiply(new THREE.Quaternion().setFromAxisAngle(V3(0,1,0),dx));
};
function updateMouse(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
}
function pickEdge(){
  if(!model||state!=='idle')return null;
  ray.setFromCamera(mouse,camera);
  const picks=model.edges.filter(e=>e.state==='ok').map(e=>e.full);
  const hit=ray.intersectObjects(picks,false)[0];
  return hit?model.edges.find(x=>x.full===hit.object):null;
}

stage.addEventListener('pointerdown',e=>{
  updateMouse(e);
  dragging=true; downPos=[e.clientX,e.clientY]; downT=performance.now(); moved=0; vel={x:0,y:0};
  stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  updateMouse(e);
  if(dragging&&downPos){
    const dx=e.clientX-downPos[0], dy=e.clientY-downPos[1];
    moved+=Math.abs(dx)+Math.abs(dy);
    if(dx||dy){rot2(dx*0.0052,dy*0.0052); vel={x:dx*0.0052,y:dy*0.0052}; downPos=[e.clientX,e.clientY];}
  }
});
stage.addEventListener('pointerup',e=>{
  dragging=false; stage.classList.remove('dragging');
  const quick=downPos&&performance.now()-downT<500&&moved<6;   // 判定为"单击"而非拖拽
  downPos=null;
  if(!quick)return;
  updateMouse(e);
  const target=pickEdge();   // ★ 松开时重新射线拾取，不依赖按下期间被保持/清空的 hovered
  if(target)tryCut(target);
});
stage.addEventListener('wheel',e=>{
  e.preventDefault();
  camera.position.z=clamp(camera.position.z*(e.deltaY>0?1.09:0.92),5.5,17);
},{passive:false});

function faceCutCount(name){
  return model.edges.filter(e=>e.state==='cut'&&(e.f1===name||e.f2===name)).length;
}
function tryCut(e){
  /* 某面的第 4 条边：警报 + 模态弹框 */
  const over=[e.f1,e.f2].find(f=>faceCutCount(f)>=3);
  if(over){
    alarmEdge(e);
    showModal('每个面最多剪3条边哦！');
    return;
  }
  /* 会把面组剪断的棱：红闪 + 轻提示 */
  if(isBridge(e)){
    alarmEdge(e);
    toast('这样剪，有的面就和伙伴分开了哦','warn');
    return;
  }
  cutEdge(e,session);
}
function updateHover(){
  if(!model||state!=='idle'){setHovered(null);return;}
  setHovered(dragging?hovered:pickEdge());   // 拖拽期间保持原状，不再强制清空
}
function setHovered(e){
  if(hovered===e)return;
  if(hovered&&hovered.state==='ok')hovered.full.material.color.setHex(COL.edge);
  hovered=e;
  if(e){
    e.full.material.color.setHex(isBridge(e)?COL.bridge:COL.hover);
    stage.style.cursor=isBridge(e)?'not-allowed':'pointer';
  }else stage.style.cursor='';
}

/* ================= 展开图收集 ================= */
const collect={openbox:[],closedbox:[]};   // 各组件独立记录，重置/切组件不清空
function collectFaces2d(){
  /* 展开完成后所有面共面（root 为 bottom，法线朝 -y），取 fitGroup 局部坐标的 (x,z) 即 2D 布局 */
  fitGroup.updateMatrixWorld(true);
  const invFit=M4().copy(fitGroup.matrixWorld).invert();
  const arr=[];
  Object.values(model.faces).forEach(f=>{
    const [sx,sy]=f.def.size;
    const xs=[],zs=[];
    [[-sx/2,-sy/2],[sx/2,-sy/2],[sx/2,sy/2],[-sx/2,sy/2]].forEach(([u,v])=>{
      const p=V3(u,v,0).applyMatrix4(f.mesh.matrixWorld).applyMatrix4(invFit);
      xs.push(p.x); zs.push(p.z);
    });
    const minx=Math.min(...xs),maxx=Math.max(...xs),minz=Math.min(...zs),maxz=Math.max(...zs);
    arr.push({
      cx:(minx+maxx)/2, cz:(minz+maxz)/2,
      w:maxx-minx, h:maxz-minz,
      ch:f.def.label.split('\n')[0],
    });
  });
  return arr;
}
function layoutSig(faces){
  /* 形状等价签名：4 旋转 × 2 翻转共 8 种对称，归一化后取字典序最小的串 */
  const sigs=[];
  for(const mx of[1,-1])for(const mz of[1,-1]){
    let fs=faces.map(f=>({x:f.cx*mx,z:f.cz*mz,w:f.w,h:f.h}));
    for(let r=0;r<4;r++){
      const ox=Math.min(...fs.map(f=>f.x-f.w/2));
      const oz=Math.min(...fs.map(f=>f.z-f.h/2));
      sigs.push(fs.map(f=>`${(f.x-ox).toFixed(2)},${(f.z-oz).toFixed(2)},${f.w.toFixed(2)},${f.h.toFixed(2)}`).sort().join('|'));
      fs=fs.map(f=>({x:f.z,z:-f.x,w:f.h,h:f.w}));   // 旋转 90°
    }
  }
  return sigs.sort()[0];
}
function layoutSVG(faces){
  const ox=Math.min(...faces.map(f=>f.cx-f.w/2));
  const oz=Math.min(...faces.map(f=>f.cz-f.h/2));
  const W=Math.max(...faces.map(f=>f.cx+f.w/2))-ox;
  const H=Math.max(...faces.map(f=>f.cz+f.h/2))-oz;
  const pad=0.3;
  const body=faces.map(f=>{
    const x=f.cx-f.w/2-ox, y=f.cz-f.h/2-oz;
    const fs=(Math.min(f.w,f.h)*0.42).toFixed(2);
    return `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${f.w.toFixed(2)}" height="${f.h.toFixed(2)}" rx="0.1" fill="#e9dec4" stroke="#b39a6b" stroke-width="0.07"/>`+
      `<text x="${(x+f.w/2).toFixed(2)}" y="${(y+f.h/2).toFixed(2)}" font-size="${fs}" fill="#a08b5f" opacity=".8" text-anchor="middle" dominant-baseline="middle">${f.ch}</text>`;
  }).join('');
  return `<svg viewBox="${(-pad).toFixed(2)} ${(-pad).toFixed(2)} ${(W+2*pad).toFixed(2)} ${(H+2*pad).toFixed(2)}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
}
function renderCollect(){
  const cfg=CONFIGS[curCfg];
  const wrap=$('collectWrap');
  if(cfg.id==='tube'||!collect[cfg.id]){wrap.style.display='none';return;}
  wrap.style.display='';
  const list=collect[cfg.id];
  $('collectCnt').textContent=`· ${list.length} 种`;
  const row=$('collectRow'); row.innerHTML='';
  list.forEach((it,i)=>{
    const el=document.createElement('div'); el.className='colItem';
    el.innerHTML=layoutSVG(it.faces)+`<div class="no">第 ${i+1} 种</div>`;
    row.appendChild(el);
  });
}
function recordCollect(){
  const cfg=model.cfg;
  if(cfg.id==='tube')return '';
  const faces=collectFaces2d();
  const sig=layoutSig(faces);
  const list=collect[cfg.id];
  if(list.some(x=>x.sig===sig)){
    return '这种展开图之前已经收集过啦';
  }
  list.push({sig,faces});
  renderCollect();
  return `新发现一种展开图！已收集 ${list.length} 种`;
}
function updateSteps(){
  const lis=$('steps').children;
  lis[0].className='done';
  if(state==='flat'){lis[1].className='done';lis[2].className='act';}
  else if(state==='idle'&&model.cutCount>0){lis[1].className='done';lis[2].className='';}
  else if(state==='idle'){lis[1].className='act';lis[2].className='';}
  else{lis[1].className='done';lis[2].className='';}
}

(function initCards(){

      curCfg=i;
      [...wrap.children].forEach((x,j)=>{
        x.classList.toggle('on',j===i);
        x.querySelector('svg').setAttribute('stroke',j===i?'#e8863a':'#8a92a3');
      });
      resetAll();
    };
    wrap.appendChild(el);
  });
})();
$('btnMain').onclick=()=>{
  if(state==='unfolding'||state==='folding'||state==='healing')return;
  if(state==='flat'){doFoldAndHeal();return;}
  if(model.cutCount>=model.needCut){doUnfold();}
  else{
    $('btnMain').classList.remove('shake'); void $('btnMain').offsetWidth;
    $('btnMain').classList.add('shake');
    showModal(`剪${model.cutCount}条边还无法展开哦`);
  }
};
$('btnReset').onclick=resetAll;
function resetAll(){
  tweens.length=0;
  state='idle';
  buildModel(CONFIGS[curCfg]);   // buildModel 内部会 session++，作废进行中的动画
  fitGroup.scale.setScalar(1); fitGroup.position.set(0,0,0);
  $('btnMain').textContent='展 开';
}
window.addEventListener('error',ev=>toast('脚本错误：'+ev.message,'warn'));

/* ================= 主循环 ================= */
buildModel(CONFIGS[0]);
(function loop(now){
  requestAnimationFrame(loop);
  stepTweens(now||performance.now());
  if(!dragging&&(Math.abs(vel.x)>1e-4||Math.abs(vel.y)>1e-4)){
    rot2(vel.x,vel.y); vel.x*=0.94; vel.y*=0.94;
  }
  updateHover();
  renderer.render(scene,camera);
})();
</script>
</body>
</html>
