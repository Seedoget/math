<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>多位数乘一位数</title>
<style>
:root{--ink:#26343a;--muted:#7e8d8f;--teal:#187a6b;--teal-dark:#0d5f53;--line:#e1e9e6;--red:#d9534f;--bg:#f6f8f7;--ans:0px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.5}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}button:disabled{cursor:default}button:focus-visible,input:focus-visible,[role="button"]:focus-visible{outline:3px solid #e3b25c;outline-offset:3px}[hidden]{display:none!important}
.sheet{max-width:1280px;margin:0 auto;background:#fff;min-height:100vh;padding:22px 34px 42px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:16px}h1{font-size:21px;font-weight:600;letter-spacing:1px;margin:0}
#reset{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:7px;padding:7px 12px;font-size:12px}#reset:hover{color:var(--teal-dark);border-color:#b9d3c9}
.setup{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;width:fit-content;max-width:100%;background:#f7faf8;border-radius:12px;padding:14px 16px}
.len{display:flex;gap:2px;background:#eaf1ee;border-radius:7px;padding:2px;margin-bottom:23px}.len button{border:0;background:none;padding:6px 10px;border-radius:5px;font-size:12px;color:#6d827b}.len button.on{background:#fff;color:var(--teal-dark);font-weight:600;box-shadow:0 1px 3px #00000010}.len button:disabled{opacity:.65}
.fields{display:flex;align-items:flex-end;gap:5px}.field{text-align:center}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input{display:block;width:46px;height:46px;border:1.5px solid #c8d8d2;border-radius:5px;background:#fff;color:var(--ink);font-size:26px;font-weight:600;text-align:center;padding:0;appearance:textfield;-moz-appearance:textfield}.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{appearance:none;margin:0}.field input:focus{border-color:var(--teal)}.field input:disabled{background:#f4f8f6;opacity:1;-webkit-text-fill-color:var(--ink);color:var(--ink)}
.step-btns{display:flex;justify-content:center;gap:2px;margin-top:3px}.step-btns button{width:22px;height:20px;border:0;border-radius:4px;background:#eaf1ee;color:#4f6f66;font-size:14px;line-height:1;padding:0}.step-btns button:hover:not(:disabled){background:#dcebe4;color:var(--teal-dark)}.step-btns button:disabled{opacity:.35}
.times{font-size:24px;color:#6c7f7a;padding-bottom:29px;width:18px;text-align:center}
.primary{height:46px;min-width:88px;padding:0 20px;border:0;border-radius:8px;background:var(--teal);color:#fff;font-size:14px;font-weight:600;margin-bottom:23px}.primary:hover:not(:disabled){background:var(--teal-dark)}.primary:disabled{background:#e7efec;color:#7d948c}
.error{margin:8px 2px 0;color:#b03f3c;font-size:12px}
.guide{position:sticky;top:0;z-index:5;min-height:21px;margin:0;padding:11px 2px 8px;background:#fff;font-size:13px;color:var(--teal-dark);font-weight:500}
.board{border-top:1px solid var(--line);padding-top:13px;min-height:240px}.scroll{overflow-x:auto;overscroll-behavior-x:contain}.diagram{--cols:3;--rail:76px;--cell:92px;--ans:130px;padding-right:14px;min-width:calc(var(--rail) + var(--cols) * var(--cell) + var(--ans) + 14px)}.diagram.three{--rail:88px;--cell:100px;--ans:166px}
.place-header{display:grid;align-items:end;padding-bottom:7px}.place{text-align:center;font-size:14px;font-weight:600;letter-spacing:3px;color:#5b7c72}
.placeholder{margin:0;padding:64px 0;text-align:center;color:#a3b2ae;font-size:12px}
.row{display:grid;grid-template-columns:var(--rail) minmax(0,1fr) var(--ans);align-items:center;margin-bottom:9px;position:relative}.rail{display:flex;align-items:center;justify-content:flex-end;padding-right:7px;position:relative}.addend{font-size:21px;font-weight:600;color:#4b6a61;white-space:nowrap;letter-spacing:.5px}.addend .op{position:absolute;left:0;top:50%;transform:translateY(-50%);color:var(--teal);font-weight:700}
.sources{position:relative;margin-top:4px}.outline{position:absolute;inset:-9px -9px 49px -9px;border:2px dashed #8fb3a6;border-radius:8px;pointer-events:none}
.bar{position:relative;display:block;width:100%;margin:16px 0 0;padding:22px 0 16px;border:0;background:none;cursor:pointer}.bar-tip{position:absolute;left:50%;transform:translateX(-50%);top:3px;height:14px;line-height:14px;font-size:12px;font-weight:600;letter-spacing:1px;color:var(--teal);pointer-events:none}.bar:before{content:"";display:block;height:3px;border-radius:2px;background:var(--teal);animation:barglow 2s ease-in-out 2;transition:background .15s}.bar:hover:before{background:var(--teal-dark);animation:none;box-shadow:0 0 0 6px rgba(24,122,107,.14)}.bar.static{cursor:default;pointer-events:none}.bar.static:before{background:var(--ink);animation:none;box-shadow:none}
@keyframes barglow{0%,100%{box-shadow:0 0 0 0 rgba(24,122,107,.26)}50%{box-shadow:0 0 0 6px rgba(24,122,107,.1)}}
.table{display:grid;border:1.5px solid #b9cdc6;border-radius:6px;overflow:hidden;background:#fff;min-width:0}.cell{border-right:1px solid #d7e2dd;min-width:0;position:relative;transition:background .15s}.cell:last-child{border-right:0}.cell.muted{background:#fafbfa}.cell.muted .cell-svg{opacity:.25}.cell.active{background:#eff9f3;box-shadow:inset 0 0 0 2px #74b39c}
.cell-svg{display:block;width:100%;overflow:visible}.hit{cursor:pointer;touch-action:manipulation;outline:none}.dot{transition:fill .12s,stroke .12s}.hit:hover:not(.on) .dot{stroke:#c98f36;stroke-width:2.5}.hit:focus-visible .dot{stroke:#c98f36;stroke-width:3}.halo{opacity:0;fill:#cbe8db}.on .halo{opacity:1}.on .dot{stroke:#0b5e51;stroke-width:2}.ring{fill:#eaf3e6;fill-opacity:.5;stroke:#8ba268;stroke-width:1.5}
.plus{position:absolute;right:7px;bottom:5px;width:27px;height:27px;border-radius:6px;border:1px solid #a9c9bb;background:#eef6f1;color:var(--teal-dark);font-size:20px;line-height:1;display:grid;place-items:center;padding:0}.plus:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.rec{display:flex;align-items:center;justify-content:flex-end;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:#3c5f54;white-space:nowrap;padding-left:10px}
.rec .eq{margin-right:8px;color:#93a5a0;font-weight:500}
.rec .p{text-align:right;padding:0 4px;border-left:2px solid #c3d3cd;line-height:1.3}
.rec em{font-style:normal;color:var(--red)}
.step{margin-top:6px}.lane{height:54px;position:relative;margin-left:var(--rail)}.carry{position:absolute;top:0;height:52px;padding:0;border:0;background:none;color:var(--teal);border-radius:6px}.carry svg{width:100%;height:52px;overflow:visible}.carry span{position:absolute;top:1px;left:0;width:100%;text-align:center;font-size:14px;font-weight:700}.carry:hover{background:#f1f8f4}
.swipe{margin:6px 0 0;text-align:right;font-size:10px;color:#a0afaa}
.leave{animation:fade 4s ease-in-out both}.arrive{animation:pop 4s ease-in-out both}@keyframes fade{to{opacity:0}}@keyframes pop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@media(max-width:760px){.sheet{padding:16px 14px 30px}h1{font-size:18px}.setup{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px 8px;align-items:end;padding:12px}.len{grid-column:1/-1;justify-self:start;margin-bottom:0}.fields{grid-column:1;min-width:0}.primary{grid-column:2;margin-bottom:23px;align-self:end}.field input{width:44px;height:44px;font-size:24px}.times{padding-bottom:27px;font-size:22px}.primary{height:44px;padding:0 16px}.guide{font-size:12px}.place{font-size:13px;letter-spacing:2px}.diagram{--rail:68px;--cell:92px;--ans:114px}.diagram.three{--rail:78px;--cell:100px;--ans:146px}.addend{font-size:18px}.rec{font-size:17px;padding-left:6px}.rec .p{padding:0 3px}}
@media(max-width:560px){.diagram{--ans:0px}.row{grid-template-columns:var(--rail) minmax(0,1fr)}.rec{grid-column:2;justify-self:end;margin:-3px 0 5px;padding-left:0}.rec .p{padding:0 5px}}
@media(max-width:360px){.setup{grid-template-columns:1fr}.fields,.primary{grid-column:1}.primary{justify-self:stretch}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.leave,.arrive{animation:none}.bar:before{animation:none}}
</style>
</head>
<body>
<main class="sheet">
  <header><h1>多位数乘一位数</h1><button id="reset">重新开始</button></header>
  <section class="setup" aria-label="设置算式">
    <div class="len" role="group" aria-label="多位数的位数"><button data-len="3" class="on">两位数</button><button data-len="4">三位数</button></div>
    <div class="fields">
      <div class="field" id="hundreds-field" hidden><label for="hundreds">百位</label><input id="hundreds" type="number" inputmode="numeric" min="1" max="9" step="1" value="1"><div class="step-btns"><button data-adjust="hundreds" data-delta="-1" aria-label="百位减一">−</button><button data-adjust="hundreds" data-delta="1" aria-label="百位加一">＋</button></div></div>
      <div class="field"><label for="tens">十位</label><input id="tens" type="number" inputmode="numeric" min="1" max="9" step="1" value="2"><div class="step-btns"><button data-adjust="tens" data-delta="-1" aria-label="十位减一">−</button><button data-adjust="tens" data-delta="1" aria-label="十位加一">＋</button></div></div>
      <div class="field"><label for="ones">个位</label><input id="ones" type="number" inputmode="numeric" min="0" max="9" step="1" value="4"><div class="step-btns"><button data-adjust="ones" data-delta="-1" aria-label="个位减一">−</button><button data-adjust="ones" data-delta="1" aria-label="个位加一">＋</button></div></div>
      <span class="times" aria-hidden="true">×</span>
      <div class="field"><label for="multiplier">乘数</label><input id="multiplier" type="number" inputmode="numeric" min="1" max="9" step="1" value="9"><div class="step-btns"><button data-adjust="multiplier" data-delta="-1" aria-label="乘数减一">−</button><button data-adjust="multiplier" data-delta="1" aria-label="乘数加一">＋</button></div></div>
    </div>
    <button id="confirm" class="primary">确认</button>
  </section>
  <p class="error" id="error" role="alert" hidden></p>
  <p class="guide" id="guide" aria-live="polite">设置算式后点“确认”。</p>
  <section class="board" aria-label="点子图">
    <div class="scroll" id="scroll"><div class="diagram" id="diagram">
      <div class="place-header" id="place-header" hidden></div>
      <div id="content"><p class="placeholder">确认后在这里显示点子图</p></div>
    </div></div>
    <p class="swipe" id="swipe" hidden>可左右滑动</p>
  </section>
</main>
<script>
'use strict';
(() => {
  const $=id=>document.getElementById(id);
  const ALL_PLACE=['千位','百位','十位','个位'],ALL_UNIT=['千','百','十','一'],ALL_W=[1000,100,10,1];
  const INPUTS=['hundreds','tens','ones','multiplier'];
  const state={phase:'input',len:3,digits:[0,2,4],multiplier:9,sources:0,rows:[],active:-1,serial:0,run:0,animating:false};
  let timer=null,frame=null,lastW=0,pendingResize=false;
  const content=$('content');
  const places=()=>ALL_PLACE.slice(4-state.len);
  const units=()=>ALL_UNIT.slice(4-state.len);
  const weights=()=>ALL_W.slice(4-state.len);
  const INK='#26343a',RED='#d9534f',SEL='#187a6b';
  const dots=(n,red=false)=>Array.from({length:n},()=>({id:++state.serial,red}));
  const emptyPacks=()=>Array.from({length:state.len},()=>[]);
  const counts=row=>row.cols.map(col=>col.length);
  const total=row=>counts(row).reduce((sum,n,i)=>sum+n*weights()[i],0);
  function rowFromCounts(cs){return {id:state.rows.length,cols:cs.map(n=>dots(n)),packs:emptyPacks(),selected:[],active:-1,status:'current',transition:null,carriedFrom:null};}
  function tableWidth(){const cs=getComputedStyle($('diagram')),rail=parseFloat(cs.getPropertyValue('--rail'))||48,ans=parseFloat(cs.getPropertyValue('--ans'))||0;return Math.max(96,($('place-header').clientWidth-rail-ans)/state.len);}
  function geometry(){const width=tableWidth(),pitch=20,radius=7.2,groupW=100,blockH=40,groupH=52,pad=8;const across=Math.max(1,Math.floor((width-2*pad+8)/(groupW+8)));return {width,pitch,radius,groupW,blockH,groupH,pad,across};}
  function layoutColumn(col,packs,g){
    const packed=new Set(packs.flat());
    const groups=packs.map(ids=>({packed:true,dots:ids.map(id=>col.find(d=>d.id===id)).filter(Boolean)}));
    const loose=col.filter(d=>!packed.has(d.id));
    for(let i=0;i<loose.length;i+=10)groups.push({packed:false,dots:loose.slice(i,i+10)});
    const rows=Math.max(1,Math.ceil(groups.length/g.across));
    const used=Math.min(g.across,Math.max(1,groups.length));
    const left=(g.width-(used*g.groupW+(used-1)*8))/2;
    const out=[];
    groups.forEach((group,index)=>{
      const gx=left+(index%g.across)*(g.groupW+8),gy=g.pad+Math.floor(index/g.across)*g.groupH;
      const cols=Math.min(5,group.dots.length),rws=Math.ceil(group.dots.length/5);
      const ox=(g.groupW-cols*g.pitch)/2+g.pitch/2,oy=(g.blockH-rws*g.pitch)/2+g.pitch/2;
      out.push({packed:group.packed,ids:group.dots.map(d=>d.id),x:gx,y:gy,points:group.dots.map((dot,n)=>({dot,x:gx+ox+(n%5)*g.pitch,y:gy+oy+Math.floor(n/5)*g.pitch}))});
    });
    return {groups:out,height:g.pad*2+(rows-1)*g.groupH+g.blockH};
  }
  function svgColumn(col,packs,row,i,height,g,source){
    const lay=layoutColumn(col,packs,g);
    const interactive=!source&&row.status==='current'&&row.active===i&&state.phase==='regroup'&&!state.animating;
    const sel=new Set(row.selected||[]);
    const depart=row.transition&&row.transition.from===i?new Set(row.transition.departing):new Set();
    const arrive=row.transition?new Set(row.transition.incoming):new Set();
    const canCount=col.length-packs.length*10>=10;
    const scene=lay.groups.map(gr=>{
      const leaving=gr.packed&&gr.ids.every(id=>depart.has(id));
      const ring=gr.packed?`<rect class="ring" x="${gr.x+1}" y="${gr.y}" width="${g.groupW-2}" height="${g.blockH}" rx="16"/>`:'';
      const pts=gr.points.map(({dot,x,y})=>{
        const on=sel.has(dot.id),clickable=interactive&&!gr.packed&&canCount;
        const role=clickable?`role="button" tabindex="0" data-dot="${dot.id}" data-col="${i}" data-row="${row.id}" aria-label="${places()[i]}点子${on?'，已选，再点取消':''}"`:'';
        return `<g class="${clickable?'hit ':''}${on?'on ':''}${arrive.has(dot.id)?'arrive':''}" ${role} style="transform-origin:${x}px ${y}px"><circle cx="${x}" cy="${y}" r="10" fill="transparent"/><circle class="halo" cx="${x}" cy="${y}" r="9"/><circle class="dot" cx="${x}" cy="${y}" r="${g.radius}" fill="${on?SEL:dot.red?RED:INK}"/></g>`;
      }).join('');
      return `<g class="${leaving?'leave':''}">${ring}${pts}</g>`;
    }).join('');
    return `<svg class="cell-svg" viewBox="0 0 ${g.width} ${height}" height="${height}" role="${interactive?'group':'img'}" aria-label="${places()[i]}，${col.length}个点">${scene}</svg>`;
  }
  function renderTable(row,g,opt={}){
    const source=!!opt.source;
    const maxH=Math.max(...row.cols.map((col,i)=>layoutColumn(col,row.packs[i],g).height));
    const height=source?maxH+(opt.plus?34:0):maxH;
    const cells=row.cols.map((col,i)=>{
      const active=!source&&row.status==='current'&&row.active===i;
      const muted=!source&&row.status==='current'&&row.active>=0&&!active;
      const plus=source&&opt.plus&&i===state.len-1;
      return `<div class="cell ${active?'active':''} ${muted?'muted':''}" data-place="${i}">${svgColumn(col,row.packs[i],row,i,height,g,source)}${plus?'<button class="plus" data-action="add" aria-label="再添一份">＋</button>':''}</div>`;
    }).join('');
    return `<div class="table" style="grid-template-columns:repeat(${state.len},minmax(0,1fr))" data-counts="${counts(row).join(',')}">${cells}</div>`;
  }
  function renderSources(g){
    if(!state.sources)return '';
    const complete=state.sources===state.multiplier,showMerge=state.phase==='ready';
    const src={id:-1,cols:state.digits.map((n,i)=>Array.from({length:n},(_,j)=>({id:1000+i*100+j,red:false}))),packs:emptyPacks(),selected:[],active:-1,status:'source',transition:null};
    const addend=state.digits.slice(1).join('');
    let rows='';
    for(let i=0;i<state.sources;i++){
      const last=i===state.sources-1;
      rows+=`<div class="row" id="source-${i}"><div class="rail"><span class="addend">${last?'<span class="op">＋</span>':''}${addend}=</span></div>${renderTable(src,g,{source:true,plus:last&&!complete})}</div>`;
    }
    const bar=showMerge?'<button class="bar" data-action="merge" title="合并" aria-label="合并"><span class="bar-tip">合并</span></button>':state.rows.length?'<div class="bar static" aria-hidden="true"></div>':'';
    return `<div class="sources ${showMerge?'ready':''}">${showMerge?'<div class="outline"></div>':''}${rows}${bar}</div>`;
  }
  function carryArrow(row){
    if(state.phase!=='regroup'||state.animating||row.status!=='current'||row.active<0)return '';
    const i=row.active,p=row.packs[i].length,avail=Math.floor(row.cols[i].length/10);
    if(!p||p!==avail)return '';
    return `<div class="lane"><button class="carry" style="left:${(i-1)*100/state.len}%;width:${200/state.len}%" data-action="carry" aria-label="进位"><svg viewBox="0 0 200 52" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#187a6b" stroke-width="1.5"/></marker></defs><path d="M150 40C140 27 62 27 50 40" fill="none" stroke="#187a6b" stroke-width="1.8" marker-end="url(#ah)"/></svg><span>进位</span></button></div>`;
  }
  function recordWidths(){
    return places().map((_,i)=>{
      let d=0;
      for(const r of state.rows)d=Math.max(d,String(counts(r)[i]).length);
      return d;
    });
  }
  function renderRecord(row){
    if(row.status==='transition')return '<div class="rec"></div>';
    const cs=counts(row),w=recordWidths();
    let started=false,cells='';
    for(let i=0;i<state.len;i++){
      const n=cs[i];
      if(!started&&n===0)continue;
      const first=!started;
      started=true;
      const digits=String(n);
      let txt=digits;
      if(row.carriedFrom===i&&digits.length>1)txt=`<em>${digits.slice(0,-1)}</em>${digits.slice(-1)}`;
      cells+=`<span class="p${first?' first':''}" style="width:calc(${Math.max(w[i],digits.length)}ch + 8px)">${txt}</span>`;
    }
    return `<div class="rec" role="status" aria-label="数位记录：${cs.join('、')}"><span class="eq">=</span>${cells}</div>`;
  }
  function renderRow(row,g){
    return `<section class="step" id="step-${row.id}">${carryArrow(row)}<div class="row"><div class="rail"></div>${renderTable(row,g)}${renderRecord(row)}</div></section>`;
  }
  function render(){
    if(state.phase==='input')return;
    const g=geometry();
    content.innerHTML=renderSources(g)+state.rows.map(row=>renderRow(row,g)).join('');
    guide();requestAnimationFrame(updateSwipe);
  }
  function updateSwipe(){const sc=$('scroll');$('swipe').hidden=sc.scrollWidth<=sc.clientWidth+8;}
  function guide(){
    let text='';
    if(state.phase==='input')text='设置算式后点“确认”。';
    else if(state.phase==='adding')text=`点“＋”再添一份（${state.sources} / ${state.multiplier}）。`;
    else if(state.phase==='ready')text='点下面的横线，把每一份合起来。';
    else if(state.phase==='animating'){const tr=state.rows.at(-1).transition;text=`${places()[tr.from]} → ${places()[tr.from-1]}，正在进位…`;}
    else if(state.phase==='regroup'){
      const row=state.rows.at(-1),i=row.active,p=row.packs[i].length,rem=row.cols[i].length-p*10;
      text=rem>=10?`${places()[i]}：点亮点子，满 10 个自动打包（${row.selected.length} / 10）。`:`${places()[i]}：已打包 ${p} 包，还剩 ${rem} 个点。点上方“进位”。`;
    }else text=`计算完成：${state.digits.slice(1).join('')} × ${state.multiplier} = ${total(state.rows.at(-1))}。`;
    $('guide').textContent=text;
  }
  function sync(){
    for(const id of INPUTS){
      const f=$(id),ok=/^\d$/.test(f.value),n=Number(f.value);
      document.querySelectorAll(`[data-adjust="${id}"]`).forEach(b=>{b.disabled=state.phase!=='input'||(ok&&(Number(b.dataset.delta)>0?n>=Number(f.max):n<=Number(f.min)));});
    }
  }
  function lock(on){
    for(const id of INPUTS)$(id).disabled=on;
    document.querySelectorAll('[data-len]').forEach(b=>b.disabled=on);
    const c=$('confirm');c.disabled=on;c.textContent=on?'已确认':'确认';
    sync();
  }
  function prepareHeader(){
    const ph=$('place-header');
    ph.innerHTML='<span></span>'+places().map(name=>`<div class="place">${name}</div>`).join('');
    ph.style.gridTemplateColumns=`var(--rail) repeat(${state.len},minmax(0,1fr)) var(--ans)`;
    ph.hidden=false;
    $('diagram').style.setProperty('--cols',state.len);
    $('diagram').classList.toggle('three',state.len===4);
  }
  function locate(){
    const last=state.rows.at(-1);
    const target=last?$(`step-${last.id}`):state.phase==='ready'?document.querySelector('button.bar'):state.phase==='adding'?document.querySelector('.plus'):null;
    if(!target)return;
    requestAnimationFrame(()=>{
      const box=target.getBoundingClientRect(),pad=56;
      if(box.bottom>window.innerHeight-pad)window.scrollBy({top:box.bottom-(window.innerHeight-pad),behavior:'smooth'});
      else if(box.top<pad)window.scrollBy({top:box.top-pad,behavior:'smooth'});
      const sc=$('scroll');
      if(sc.scrollWidth>sc.clientWidth+2){
        if(state.active>=0&&last){
          const cell=document.querySelector(`#step-${last.id} [data-place="${state.active}"]`);
          if(cell){const cr=cell.getBoundingClientRect(),sr=sc.getBoundingClientRect();if(cr.right>sr.right||cr.left<sr.left)sc.scrollBy({left:cr.left-sr.left-(sc.clientWidth-cr.width)/2,behavior:'smooth'});}
        }else if(state.phase==='ready'||state.phase==='adding'){
          const edge=state.phase==='ready'?document.querySelector('button.bar'):document.querySelector('.plus');
          if(edge){const er=edge.getBoundingClientRect(),sr=sc.getBoundingClientRect();if(er.right>sr.right)sc.scrollTo({left:sc.scrollWidth,behavior:'smooth'});}
        }
      }
    });
  }
  function confirm(){
    if(state.phase!=='input')return;
    const ids=state.len===4?['hundreds','tens','ones']:['tens','ones'];
    const bad=ids.findIndex(id=>{const f=$(id);return !/^\d$/.test(f.value)||Number(f.value)<Number(f.min)||Number(f.value)>Number(f.max);});
    if(bad!==-1){const f=$(ids[bad]);$('error').hidden=false;$('error').textContent=`${f.closest('.field').querySelector('label').textContent}需在 ${f.min}–${f.max} 之间。`;f.focus();return;}
    const m=$('multiplier');
    if(!/^\d$/.test(m.value)||Number(m.value)<1||Number(m.value)>9){$('error').hidden=false;$('error').textContent='乘数需在 1–9 之间。';m.focus();return;}
    $('error').hidden=true;
    state.digits=[0,...ids.map(id=>Number($(id).value))];
    state.multiplier=Number(m.value);state.sources=1;state.phase=state.multiplier===1?'ready':'adding';state.run++;
    prepareHeader();lock(true);render();locate();
  }
  function add(){
    if(state.phase!=='adding'||state.sources>=state.multiplier)return;
    state.sources++;
    if(state.sources===state.multiplier)state.phase='ready';
    render();locate();
  }
  function activate(row){
    row.active=-1;state.active=-1;
    for(let i=state.len-1;i>=1;i--)if(row.cols[i].length>=10){row.active=i;state.active=i;row.status='current';state.phase='regroup';return;}
    row.status='final';state.phase='done';
  }
  function merge(){
    if(state.phase!=='ready')return;
    const row=rowFromCounts(state.digits.map(n=>n*state.multiplier));
    state.rows.push(row);activate(row);render();locate();
  }
  function selectDot(rowId,col,id){
    if(state.phase!=='regroup'||state.animating)return;
    const row=state.rows.at(-1);
    if(!row||row.id!==rowId||row.active!==col||row.status!=='current')return;
    if(row.packs[col].flat().includes(id)||!row.cols[col].some(d=>d.id===id))return;
    if(row.cols[col].length-row.packs[col].length*10<10)return;
    const k=row.selected.indexOf(id);
    if(k>=0)row.selected.splice(k,1);else row.selected.push(id);
    let packed=false;
    if(row.selected.length===10){row.packs[col].push([...row.selected]);row.selected=[];packed=true;}
    render();
    if(packed){const rem=row.cols[col].length-row.packs[col].length*10;if(rem<10)locate();}
  }
  function carry(){
    if(state.phase!=='regroup'||state.animating)return;
    const row=state.rows.at(-1),from=row.active;
    if(from<=0)return;
    const amount=Math.floor(row.cols[from].length/10);
    if(!amount||row.packs[from].length!==amount||row.selected.length)return;
    const run=state.run,departing=row.packs[from].flat(),dep=new Set(departing);
    row.status='past';
    const copy=row.cols.map(col=>col.map(d=>({id:d.id,red:false})));
    const incoming=dots(amount,true);
    copy[from-1].push(...incoming);
    const next={id:state.rows.length,cols:copy,packs:row.packs.map(p=>p.map(ids=>[...ids])),selected:[],active:-1,status:'transition',transition:{from,amount,departing,incoming:incoming.map(d=>d.id)}};
    state.rows.push(next);state.animating=true;state.active=-1;state.phase='animating';
    render();locate();
    timer=setTimeout(()=>{
      if(state.run!==run)return;
      row.carriedFrom=from;
      next.cols[from]=next.cols[from].filter(d=>!dep.has(d.id));
      next.packs=emptyPacks();next.transition=null;state.animating=false;
      activate(next);render();locate();
      if(pendingResize){pendingResize=false;render();}
    },4000);
  }
  function reset(){
    clearTimeout(timer);state.run++;state.phase='input';state.sources=0;state.rows=[];state.active=-1;state.animating=false;pendingResize=false;
    content.innerHTML='<p class="placeholder">确认后在这里显示点子图</p>';
    $('place-header').hidden=true;$('error').hidden=true;
    lock(false);guide();$('scroll').scrollLeft=0;window.scrollTo({top:0,behavior:'smooth'});$('swipe').hidden=true;
  }
  function toggleLen(len){
    if(state.phase!=='input'||len===state.len)return;
    state.len=len;
    $('hundreds-field').hidden=len!==4;
    $('tens').min=len===4?'0':'1';
    if(len===3&&Number($('tens').value)<1)$('tens').value='1';
    document.querySelectorAll('[data-len]').forEach(b=>b.classList.toggle('on',Number(b.dataset.len)===len));
    sync();$('error').hidden=true;
  }
  document.addEventListener('click',event=>{
    const dot=event.target.closest('[data-dot]');
    if(dot){selectDot(Number(dot.dataset.row),Number(dot.dataset.col),Number(dot.dataset.dot));return;}
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.adjust&&state.phase==='input'){
      const f=$(button.dataset.adjust),min=Number(f.min),max=Number(f.max),cur=f.value===''?min:Number(f.value);
      f.value=String(Math.max(min,Math.min(max,cur+Number(button.dataset.delta))));
      sync();$('error').hidden=true;return;
    }
    if(button.dataset.len){toggleLen(Number(button.dataset.len));return;}
    if(button.dataset.action==='add'){add();return;}
    if(button.dataset.action==='merge'){merge();return;}
    if(button.dataset.action==='carry'){carry();return;}
  });
  content.addEventListener('keydown',event=>{
    const dot=event.target.closest('[data-dot]');
    if(!dot||(event.key!=='Enter'&&event.key!==' '))return;
    event.preventDefault();
    selectDot(Number(dot.dataset.row),Number(dot.dataset.col),Number(dot.dataset.dot));
    requestAnimationFrame(()=>{const next=content.querySelector('[data-dot]')||content.querySelector('[data-action="carry"]');if(next)next.focus({preventScroll:true});});
  });
  $('confirm').addEventListener('click',confirm);
  $('reset').addEventListener('click',reset);
  for(const id of INPUTS){
    const f=$(id);
    f.addEventListener('input',()=>{sync();$('error').hidden=true;});
    f.addEventListener('focus',()=>f.select());
    f.addEventListener('keydown',event=>{if(event.key==='Enter')confirm();});
  }
  const observer=new ResizeObserver(()=>{
    const w=$('place-header').clientWidth;
    if(Math.abs(w-lastW)<1)return;
    lastW=w;cancelAnimationFrame(frame);
    frame=requestAnimationFrame(()=>{if(state.animating){pendingResize=true;return;}if(state.phase!=='input')render();updateSwipe();});
  });
  observer.observe($('place-header'));
  sync();guide();
  Object.defineProperty(window,'coursewareSnapshot',{value:()=>({phase:state.phase,len:state.len,digits:[...state.digits],multiplier:state.multiplier,sources:state.sources,active:state.active,animating:state.animating,rows:state.rows.map(row=>({id:row.id,counts:counts(row),packs:row.packs.map(p=>p.length),selected:[...row.selected],status:row.status,red:row.cols.map(col=>col.filter(d=>d.red).length),total:row.transition?null:total(row)})),result:state.phase==='done'?total(state.rows.at(-1)):null}),writable:false});
})();
</script>
